name: Clean up workflow run history

on:
  workflow_dispatch:
    inputs:
      workflow_name:
        type: choice
        description: 'Name of the workflow to clean'
        required: true
        default: 'Build OnePlus_SukiSU Ultra All'
        options:
          - Build OnePlus_SukiSU Ultra All
          - Build TEST
          - Build TEST2
      count:
        description: 'Maximum number of runs to access'
        required: false
        default: '20'
      delete_failed:
        description: 'Delete failed run records?'
        required: false
        type: boolean
        default: true
      delete_success:
        description: 'Delete successful run records?'
        required: false
        type: boolean
        default: false
      delete_cancelled:
        description: 'Delete cancelled run records?'
        required: false
        type: boolean
        default: false
      reverse_order:
        description: 'Clean up from oldest to newest?'
        required: false
        type: boolean
        default: false

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Install GitHub CLI and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y gh jq

      - name: Authenticate GitHub CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Clean up specified workflow and this workflow's run history
        env:
          REPO: ${{ github.repository }}
          COUNT: ${{ inputs.count }}
          DELETE_FAILED: ${{ inputs.delete_failed }}
          DELETE_SUCCESS: ${{ inputs.delete_success }}
          DELETE_CANCELLED: ${{ inputs.delete_cancelled }}
          REVERSE_ORDER: ${{ inputs.reverse_order }}
          WORKFLOW_NAME: ${{ inputs.workflow_name }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -e

          echo "Finding workflow ID for \"$WORKFLOW_NAME\"..."
          WORKFLOW_ID=$(gh api repos/$REPO/actions/workflows | jq -r ".workflows[] | select(.name == \"$WORKFLOW_NAME\") | .id")
          if [ -z "$WORKFLOW_ID" ]; then
            echo "Workflow \"$WORKFLOW_NAME\" not found, exiting."
            exit 1
          fi

          echo "Starting to fetch all run records with pagination..."
          PER_PAGE=100
          PAGE=1
          MATCHED_RUNS="[]"
          while true; do
            RESP=$(gh api "repos/$REPO/actions/workflows/$WORKFLOW_ID/runs?per_page=$PER_PAGE&page=$PAGE")
            RUNS=$(echo "$RESP" | jq '.workflow_runs')
            COUNT_THIS_PAGE=$(echo "$RUNS" | jq 'length')

            if [ "$COUNT_THIS_PAGE" -eq 0 ]; then
              break
            fi

            MATCHED_RUNS=$(jq -s 'add' <(echo "$MATCHED_RUNS") <(echo "$RUNS"))
            PAGE=$((PAGE + 1))
          done

          echo "Fetched a total of $(echo "$MATCHED_RUNS" | jq 'length') run records."

          # Sort order: oldest to newest or newest to oldest
          if [[ "$REVERSE_ORDER" == "true" ]]; then
            SORTED_RUNS=$(echo "$MATCHED_RUNS" | jq 'sort_by(.run_started_at)')
          else
            SORTED_RUNS=$(echo "$MATCHED_RUNS" | jq 'sort_by(.run_started_at) | reverse')
          fi

          # Keep only the first N records
          TO_DELETE_RUNS=$(echo "$SORTED_RUNS" | jq ".[0:${COUNT}]")

          echo "$TO_DELETE_RUNS" | jq -c '.[]' | while read run; do
            ID=$(echo "$run" | jq -r '.id')
            STATUS=$(echo "$run" | jq -r '.conclusion')
            STATE=$(echo "$run" | jq -r '.status')

            if [[ "$STATE" == "in_progress" || "$STATE" == "queued" ]]; then
              echo "Skipping run ID: $ID (status is $STATE)"
              continue
            fi

            if [[ "$STATUS" == "failure" && "$DELETE_FAILED" != "true" ]]; then continue; fi
            if [[ "$STATUS" == "success" && "$DELETE_SUCCESS" != "true" ]]; then continue; fi
            if [[ "$STATUS" == "cancelled" && "$DELETE_CANCELLED" != "true" ]]; then continue; fi

            echo "Deleting run record ID: $ID (status: $STATUS)"
            gh api -X DELETE "repos/$REPO/actions/runs/$ID" || echo "Deletion failed"
          done

          echo "Cleaning up this workflow's run history..."
          SELF_WORKFLOW_ID=$(gh api repos/$REPO/actions/workflows | jq -r '.workflows[] | select(.name == "Clean up workflow run history") | .id')
          if [ -n "$SELF_WORKFLOW_ID" ]; then
            SELF_RUNS=$(gh api "repos/$REPO/actions/workflows/$SELF_WORKFLOW_ID/runs?per_page=50" | jq -c '.workflow_runs[]')

            echo "$SELF_RUNS" | while read run; do
              ID=$(echo "$run" | jq -r '.id')
              if [[ "$ID" == "$CURRENT_RUN_ID" ]]; then
                echo "Skipping current run ID: $ID"
                continue
              fi
              echo "Deleting this workflow's run record ID: $ID"
              gh api -X DELETE "repos/$REPO/actions/runs/$ID" || echo "Deletion failed"
            done
          fi
